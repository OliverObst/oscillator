[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motion-oscillator"
version = "0.1.0"
description = "A shared phase clock and conditional whole-body harmonic motion decoder"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "torch>=2.5,<3",
  "huggingface-hub>=0.27,<2",
  "pyarrow>=18,<24",
  "matplotlib>=3.9,<4",
]

[project.scripts]
oscillator = "oscillator.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/oscillator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
